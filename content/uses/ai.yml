title: AI & Agents
order: 3
items:
  - name: Claude
    url: https://johnie.link/claude
    description: The model behind most of my work, from code to writing. AI was assistive technology for me long before it was a trend.
  - name: ChatGPT
    url: https://johnie.link/chatgpt
    description: OpenAI's assistant, which I use alongside Claude. Codex, its coding agent, is a great second opinion on tricky changes.
  - name: OpenRouter
    url: https://johnie.link/openrouter
    description: One API and one bill for hundreds of models, so trying a new one is a config change.
  - name: ElevenLabs
    url: https://johnie.link/elevenlabs
    description: Lifelike text-to-speech and voice AI, with an API that's easy to build on.
  - name: fal
    url: https://johnie.link/fal
    description: Fast, serverless inference for image, video, and audio models behind a single API.
  - name: OpenCode
    url: https://johnie.link/opencode
    description: Open-source coding agent for the terminal that works with whichever model provider I point it at.
  - name: Herdr
    url: https://johnie.link/herdr
    description: Keeps all my agents running in the background, across projects and machines, so I check in on them instead of babysitting terminals.
